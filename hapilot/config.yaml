name: HAPilot
version: "0.1.14"
slug: hapilot
description: Universal Telegram bot for Home Assistant — auto-discovery, no per-instance setup
url: https://github.com/grizlygreen/hapilot-addons
image: ghcr.io/grizlygreen/{arch}-hapilot
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
boot: auto
startup: application
map:
  - addon_config:rw
options:
  telegram_bot_token: ""
  allowed_user_ids: ""
  admin_user_ids: ""
  instance_name: "Дом"
  confirm_critical: true
  cache_ttl_seconds: 60
  log_level: info
  proxy_url: ""
schema:
  telegram_bot_token: str
  allowed_user_ids: str
  admin_user_ids: str?
  instance_name: str
  confirm_critical: bool
  cache_ttl_seconds: int(30,600)
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  proxy_url: str?
